name: smpo
channels:
  - conda-forge
  - pytorch
  - defaults
dependencies:
  - python=3.9
  - numpy
  - matplotlib
  - pandas
  - jupyterlab  # 改用更稳定的jupyterlab
  - notebook
  - ipykernel  # 固定版本避免冲突
  - pytorch-cpu # cpu 版本
#  - pytorch::pytorch  # 明确指定pytorch channel
#  - pytorch::torchvision
#  - pytorch::torchaudio  # 可选
#  - cudatoolkit=11.2    # CUDA 11.2支持(vamoops)
  - gymnasium
  - networkx
  - simpy
  - pip
  - pip:
    - stable-baselines3
    #pip install -i https://mirrors.aliyun.com/pypi/simple/ <package_name>
    #pip install -i https://mirrors.aliyun.com/pypi/simple/ stable-baselines3


# 如果需要其他深度学习框架（如TensorFlow），可添加：
# - tensorflow

# 如果需要渲染或更复杂的仿真，可添加：
# - pybullet
# - pyopengl
